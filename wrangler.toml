name = "gazelli-post"
account_id = "8dc09267cb6388daa0d0e35994fc1a68"
main = "src/index.ts"
compatibility_date = "2026-08-15"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# Every asset request must pass the optional password gate.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "gazelli-post"
database_id = "37eed85b-d04b-43df-873c-13663deece77"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gazelli-post-media"

[vars]
R2_BUCKET = "gazelli-post-media"
# Production must never enable the local direct-PUT route.
DEV_DIRECT_UPLOAD = "false"

# Workers Free: use the platform's CPU limit; do not configure a Paid-only limit.

[triggers]
crons = ["17 * * * *"]
